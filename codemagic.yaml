workflows:
  react-native-ios:
    name: LogixMobile iOS Production
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/LogixMobile.xcworkspace"
        XCODE_SCHEME: "LogixMobile"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build IPA para distribución
        script: |
          # Este comando compila la app. 
          # Nota: Para una compilación exitosa en la nube, necesitarás configurar 
          # las llaves de firma (Code Signing) en la interfaz de Codemagic.
          xcode-project build-ipa \
            --workspace "${XCODE_WORKSPACE}" \
            --scheme "${XCODE_SCHEME}"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - tu-correo@ejemplo.com
