workflows:
  ios-build:
    name: LogixMobile iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 18 # O la versión que estés usando
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/LogixMobile.xcworkspace"
        XCODE_SCHEME: "LogixMobile"
    scripts:
      - name: Instalar dependencias de NPM
        script: |
          npm install
      - name: Instalar pods
        script: |
          cd ios && pod install
      - name: Compilar archivo .ipa
        script: |
          # Este comando genera el binario. 
          # Nota: Fallará si no has configurado la firma (Code Signing) en el panel de Codemagic.
          xcode-project build-ipa \
            --workspace "${XCODE_WORKSPACE}" \
            --scheme "${XCODE_SCHEME}"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - tu-email@ejemplo.com
