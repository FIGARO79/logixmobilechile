# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=false
VisionCamera_enableCodeScanner=true
VisionCamera_enableFrameProcessors=false

# Forzar el uso del JDK 21 (descargado via Android Studio)
org.gradle.java.home=/opt/android-studio/jbr

# Release Signing Config
MYAPP_UPLOAD_STORE_FILE=logix-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=logix-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=logix123
MYAPP_UPLOAD_KEY_PASSWORD=logix123
